services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dgg_radio
      POSTGRES_USER: dgg_radio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgg_radio -d dgg_radio"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - dgg_radio_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dgg_radio:${POSTGRES_PASSWORD}@db:5432/dgg_radio
      PORT: 8787
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Publishes the API through a Cloudflare named tunnel. The public hostname
  # route lives in the Cloudflare dashboard and points at http://api:8787 over
  # the compose network, so the API publishes no host port. Outbound-only, so
  # it needs no inbound firewall rule and works behind CGNAT.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dgg_radio_postgres:
