[build]
  # Netlify clones with its GitHub token inside the remote URL, and posthog-cli
  # reads that URL to describe the release it creates, credential and all. Strip
  # any `user:password@` before the build so a token does not land in PostHog's
  # release metadata on every deploy. A checkout with no remote has nothing to
  # strip, so a failure here must never be what stops a deploy.
  command = "git remote set-url origin \"$(git remote get-url origin | sed 's#//[^@]*@#//#')\" || true; npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev:web"
  targetPort = 4321
  port = 8888
